/mapping/cloud_accumulator:
  ros__parameters:
    target_frame: odom
    base_frame: base_footprint
    voxel_size_m: 0.05
    min_range_m: 0.2
    max_range_m: 30.0
    min_z_m: -0.2
    max_z_m: 5.0
    transform_timeout_sec: 0.1
    publish_period_sec: 1.0
    max_voxels: 2000000
    log_every_n_clouds: 50
    pcd_path: /tmp/metro_accumulated_cloud.pcd
    self_filter.enabled: true
    self_filter.min_x_m: -0.9
    self_filter.max_x_m: 0.9
    self_filter.min_y_m: -0.6
    self_filter.max_y_m: 0.6
    self_filter.min_z_m: -0.1
    self_filter.max_z_m: 1.5
