<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#f7f8fa"/>
  <text x="80" y="78" font-family="sans-serif" font-size="38" font-weight="700" fill="#182026">Metro Robot Color Map</text>
  <text x="80" y="116" font-family="sans-serif" font-size="21" fill="#59636b">Gazebo Classic materials and rounded 8-bit RGB values</text>

  <g font-family="sans-serif">
    <rect x="80" y="155" width="1040" height="72" rx="6" fill="#ffffff" stroke="#d9dee3"/>
    <rect x="100" y="171" width="160" height="40" rx="4" fill="#b3b3b3"/>
    <text x="290" y="185" font-size="20" font-weight="700" fill="#182026">Light-grey structures</text>
    <text x="290" y="210" font-size="18" fill="#59636b">chassis, yaw gimbal, wheel hubs | Gazebo/Grey</text>
    <text x="900" y="198" font-size="20" font-family="monospace" fill="#182026">RGB 179, 179, 179</text>

    <rect x="80" y="239" width="1040" height="72" rx="6" fill="#ffffff" stroke="#d9dee3"/>
    <rect x="100" y="255" width="160" height="40" rx="4" fill="#1a1a1a"/>
    <text x="290" y="269" font-size="20" font-weight="700" fill="#182026">Tires</text>
    <text x="290" y="294" font-size="18" fill="#59636b">w1_tire.STL - w4_tire.STL | Gazebo/FlatBlack</text>
    <text x="900" y="282" font-size="20" font-family="monospace" fill="#182026">RGB 26, 26, 26</text>

    <rect x="80" y="323" width="1040" height="72" rx="6" fill="#ffffff" stroke="#d9dee3"/>
    <rect x="100" y="339" width="160" height="40" rx="4" fill="#ffffff" stroke="#b9c1c8"/>
    <text x="290" y="353" font-size="20" font-weight="700" fill="#182026">Cameras</text>
    <text x="290" y="378" font-size="18" fill="#59636b">xj1 - xj4, pitch camera | Gazebo/White</text>
    <text x="900" y="366" font-size="20" font-family="monospace" fill="#182026">RGB 255, 255, 255</text>

    <rect x="80" y="407" width="1040" height="72" rx="6" fill="#ffffff" stroke="#d9dee3"/>
    <rect x="100" y="423" width="160" height="40" rx="4" fill="#2d2d2d"/>
    <text x="290" y="437" font-size="20" font-weight="700" fill="#182026">Pitch assembly</text>
    <text x="290" y="462" font-size="18" fill="#59636b">pitch_body.STL | Gazebo/DarkGrey</text>
    <text x="900" y="450" font-size="20" font-family="monospace" fill="#182026">RGB 45, 45, 45</text>

    <rect x="80" y="491" width="1040" height="72" rx="6" fill="#ffffff" stroke="#d9dee3"/>
    <rect x="100" y="507" width="160" height="40" rx="4" fill="#ffffff" stroke="#b9c1c8"/>
    <text x="290" y="521" font-size="20" font-weight="700" fill="#182026">LiDAR</text>
    <text x="290" y="546" font-size="18" fill="#59636b">leida.STL | Gazebo/White</text>
    <text x="900" y="534" font-size="20" font-family="monospace" fill="#182026">RGB 255, 255, 255</text>
  </g>

  <text x="80" y="610" font-family="sans-serif" font-size="16" fill="#6d7780">Alpha = 255 for every material</text>
</svg>
